---
deployment:
  tasks:
    - export REPO=$(pwd)
    - export PUB=~/public_html
    - /bin/mkdir -p $PUB
    - /bin/cp -rf $REPO/deployment/public_html/. $PUB/
    - echo "Frontend deployed"
    - export APP=~/nodeapp
    - /bin/mkdir -p $APP
    - /bin/cp -rf $REPO/deployment/server/. $APP/
    - echo "Server copied"
    - /bin/bash -c 'cd ~/nodeapp && npm install --omit=dev 2>&1 | tail -3'
    - echo "npm install done"
    - /bin/mkdir -p ~/nodeapp/tmp
    - /bin/touch ~/nodeapp/tmp/restart.txt
    - echo "App restart triggered"
