---
deployment:
  tasks:
    # ── Frontend ──────────────────────────────────────────────────────────────
    # Copy the pre-built React app from deployment/public_html into public_html
    - /bin/mkdir -p /home/$USER/public_html
    - /bin/cp -r deployment/public_html/. /home/$USER/public_html/
    - echo "✓ Frontend deployed to /home/$USER/public_html"

    # ── Node.js server ────────────────────────────────────────────────────────
    # Copy server source files into the nodeapp directory
    - /bin/mkdir -p /home/$USER/nodeapp
    - /bin/cp -r deployment/server/. /home/$USER/nodeapp/
    - echo "✓ Server files copied to /home/$USER/nodeapp"

    # Install production Node.js dependencies
    - /bin/bash -c 'cd /home/$USER/nodeapp && npm install --omit=dev --prefer-offline 2>&1 | tail -5'
    - echo "✓ npm install complete"

    # ── Restart Node.js application ───────────────────────────────────────────
    # cPanel Node.js Selector watches for this file to trigger a restart
    - /bin/mkdir -p /home/$USER/nodeapp/tmp
    - /bin/touch /home/$USER/nodeapp/tmp/restart.txt
    - echo "✓ Node.js app restart triggered"
