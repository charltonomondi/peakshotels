---
deployment:
  tasks:
    # NOTE: Tasks run inside the cloned repository directory on the cPanel server.
    # Paths like "deployment/public_html" are relative to the repo root.
    # We use $(pwd) to get the repo path and ~ for the home directory.

    # ── 1. Frontend → public_html ─────────────────────────────────────────────
    - export REPO=$(pwd)
    - export PUB=~/public_html
    - /bin/mkdir -p $PUB
    - /bin/cp -rf $REPO/deployment/public_html/. $PUB/
    - echo "Frontend deployed"

    # ── 2. Server → nodeapp ───────────────────────────────────────────────────
    - export APP=~/nodeapp
    - /bin/mkdir -p $APP
    - /bin/cp -rf $REPO/deployment/server/. $APP/
    - echo "Server copied"

    # ── 3. Install dependencies ───────────────────────────────────────────────
    - /bin/bash -c 'cd ~/nodeapp && npm install --omit=dev 2>&1 | tail -3'
    - echo "npm install done"

    # ── 4. Restart Node.js app ────────────────────────────────────────────────
    - /bin/mkdir -p ~/nodeapp/tmp
    - /bin/touch ~/nodeapp/tmp/restart.txt
    - echo "App restart triggered"
